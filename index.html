<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Attendance Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
</head>
<style>
    body {
        font-family: 'Inter', sans-serif;
    }
    .loading {
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-blue-600 text-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center">
                        <i class="bi bi-calendar-check text-2xl mr-2"></i>
                        <span class="font-bold text-lg">BlockAttend</span>
                    </div>
                    <div id="walletStatus" class="text-sm"></div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Left Column -->
                <div class="space-y-6">
                    <!-- Student Management -->
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h2 class="text-xl font-semibold mb-4">Student Management</h2>
                        <form id="studentForm" class="space-y-4">
                            <div>
                                <input type="text" id="studentName" placeholder="Student Name" class="w-full p-2 border rounded-md">
                            </div>
                            <div>
                                <input type="text" id="studentId" placeholder="Student ID" class="w-full p-2 border rounded-md">
                            </div>
                            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                                Add Student
                            </button>
                        </form>
                    </div>

                    <!-- Subject Management -->
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h2 class="text-xl font-semibold mb-4">Subject Management</h2>
                        <form id="subjectForm" class="space-y-4">
                            <div>
                                <input type="text" id="subjectName" placeholder="Subject Name" class="w-full p-2 border rounded-md">
                            </div>
                            <div>
                                <input type="text" id="subjectCode" placeholder="Subject Code" class="w-full p-2 border rounded-md">
                            </div>
                            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                                Add Subject
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="space-y-6">
                    <!-- Attendance Marking -->
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h2 class="text-xl font-semibold mb-4">Mark Attendance</h2>
                        <div class="space-y-4">
                            <select id="selectSubject" class="w-full p-2 border rounded-md">
                                <option value="">Select Subject</option>
                            </select>
                            <div id="attendanceList" class="space-y-2">
                                <!-- Attendance entries will be added here -->
                            </div>
                            <button id="submitAttendance" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">
                                Submit Attendance
                            </button>
                        </div>
                    </div>

                    <!-- Attendance History -->
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h2 class="text-xl font-semibold mb-4">Attendance History</h2>
                        <div class="overflow-x-auto">
                            <table class="min-w-full">
                                <thead>
                                    <tr class="bg-gray-100">
                                        <th class="p-2">Date</th>
                                        <th class="p-2">Subject</th>
                                        <th class="p-2">Present</th>
                                        <th class="p-2">Absent</th>
                                    </tr>
                                </thead>
                                <tbody id="attendanceHistory">
                                    <!-- History will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize data structures
        let students = [];
        let subjects = [];
        let attendanceRecords = [];

        // Handle student form submission
        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value;
            const id = document.getElementById('studentId').value;
            
            if (name && id) {
                students.push({ name, id });
                updateAttendanceList();
                this.reset();
                alert('Student added successfully!');
            }
        });

        // Handle subject form submission
        document.getElementById('subjectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('subjectName').value;
            const code = document.getElementById('subjectCode').value;
            
            if (name && code) {
                subjects.push({ name, code });
                updateSubjectSelect();
                this.reset();
                alert('Subject added successfully!');
            }
        });

        // Update subject dropdown
        function updateSubjectSelect() {
            const select = document.getElementById('selectSubject');
            select.innerHTML = '<option value="">Select Subject</option>';
            subjects.forEach(subject => {
                select.innerHTML += `<option value="${subject.code}">${subject.name}</option>`;
            });
        }

        // Update attendance list
        function updateAttendanceList() {
            const list = document.getElementById('attendanceList');
            list.innerHTML = '';
            students.forEach(student => {
                list.innerHTML += `
                    <div class="flex items-center justify-between p-2 border rounded">
                        <span>${student.name} (${student.id})</span>
                        <div>
                            <label class="inline-flex items-center">
                                <input type="radio" name="attendance_${student.id}" value="present" class="form-radio" checked>
                                <span class="ml-2">Present</span>
                            </label>
                            <label class="inline-flex items-center ml-4">
                                <input type="radio" name="attendance_${student.id}" value="absent" class="form-radio">
                                <span class="ml-2">Absent</span>
                            </label>
                        </div>
                    </div>
                `;
            });
        }

        // Handle attendance submission
        document.getElementById('submitAttendance').addEventListener('click', async function() {
            const subject = document.getElementById('selectSubject').value;
            if (!subject) {
                alert('Please select a subject');
                return;
            }

            const attendance = {
                date: new Date().toISOString().split('T')[0],
                subject: subject,
                records: []
            };

            students.forEach(student => {
                const status = document.querySelector(`input[name="attendance_${student.id}"]:checked`).value;
                attendance.records.push({
                    studentId: student.id,
                    status: status
                });
            });

            // Store in blockchain (simulated)
            attendanceRecords.push(attendance);
            updateAttendanceHistory();
            alert('Attendance submitted successfully!');
        });

        // Update attendance history
        function updateAttendanceHistory() {
            const history = document.getElementById('attendanceHistory');
            history.innerHTML = '';
            
            attendanceRecords.slice(-7).forEach(record => {
                const present = record.records.filter(r => r.status === 'present').length;
                const absent = record.records.filter(r => r.status === 'absent').length;
                const subjectName = subjects.find(s => s.code === record.subject)?.name || record.subject;
                
                history.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2">${record.date}</td>
                        <td class="p-2">${subjectName}</td>
                        <td class="p-2">${present}</td>
                        <td class="p-2">${absent}</td>
                    </tr>
                `;
            });
        }

        // Simulate blockchain connection
        async function connectWallet() {
            const walletStatus = document.getElementById('walletStatus');
            walletStatus.innerHTML = '<i class="bi bi-circle-fill text-green-500 mr-2"></i>Connected to Blockchain';
        }

        // Initialize the app
        window.addEventListener('load', function() {
            connectWallet();
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
